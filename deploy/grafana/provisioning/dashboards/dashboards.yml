apiVersion: 1

# Dashboards are files in the repository, not clicks in the UI. A hand-built
# dashboard does not survive a pod restart and cannot be code-reviewed.
providers:
  - name: FleetController
    type: file
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
