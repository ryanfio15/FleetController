# Compose-only. The job ingress-nginx does in Kubernetes, done by the web-ui
# container itself because Stage 0 has no ingress controller.
#
# This is the one place the two environments genuinely differ in *routing*, and
# it is deliberately a config file rather than a code branch: services/web-ui's
# own nginx.conf stays the static-only server it is in the cluster, and this
# bind mount replaces it here. The browser sees the same single origin either
# way, so app.js can call a relative /api/v1 in both and §4 rule 2 holds — no
# per-environment base URL anywhere in the application.
#
# If the two ever disagree about a path, the cluster's ingress.yaml is the
# source of truth; this file follows it.

server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    gzip             on;
    gzip_types       text/css application/javascript application/json image/svg+xml;
    gzip_min_length  512;

    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Docker's embedded DNS, re-resolved rather than cached at startup: a
    # `docker compose up -d fleet-api` hands the container a new IP, and nginx
    # would otherwise keep proxying to the old one until it was restarted too.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        # In a variable on purpose — that is what makes nginx use the resolver
        # above instead of resolving once at config load and failing to start
        # when fleet-api is not up yet.
        set $fleet_api "http://fleet-api:8081";
        # No trailing slash on the proxy_pass target, so the full /api/v1/...
        # path reaches the service unmodified. The Ingress does not rewrite
        # either; fleet-api serves those routes itself.
        proxy_pass $fleet_api$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /grafana/ {
        set $grafana "http://grafana:3000";
        proxy_pass $grafana$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
