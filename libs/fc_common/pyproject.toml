[project]
name = "fc-common"
version = "0.1.0"
description = "Shared models, OBD-II definitions and logging for FleetController services"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2,<3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["fc_common*"]
