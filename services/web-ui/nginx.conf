# Static serving only. This container does **not** proxy to fleet-api.
#
# That is worth stating because the obvious alternative — a `location /api`
# block with a proxy_pass to fleet-api — is wrong here. ingress-nginx already
# routes /api to fleet-api and / to this pod (deploy/k8s/base/ingress.yaml), so
# a second proxy inside this container would be a parallel path to the API that
# the NetworkPolicy, the ingress rules and anything that ever replaces them
# know nothing about.
#
# Port 8080, not 80: nothing here needs a privileged port, and keeping off it
# means the container can be squeezed into a non-root securityContext later
# without the listener having to change.

server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # The tunnel is an SSH hop with real latency, and the assets are text.
    gzip             on;
    gzip_types       text/css application/javascript application/json image/svg+xml;
    gzip_min_length  512;

    # no-cache rather than no-store: the browser may keep a copy, it just has
    # to revalidate. The `dev` image tag is reused on every rebuild, so a
    # far-future expiry would serve yesterday's app.js from disk after a
    # rollout and look exactly like a deployment that did not take.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # X-Frame-Options is deliberately absent. This page *embeds* Grafana rather
    # than being embedded, and the two are same-origin behind one ingress, so
    # adding DENY here would be cargo cult — and SAMEORIGIN would be a promise
    # about a frame that never exists.

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        # Hash routing, so every route is index.html anyway. The fallback
        # matters for a deep link typed or refreshed at /#/vehicle/sim-car-3,
        # and for anything a future path-based router adds.
        try_files $uri $uri/ /index.html;
    }
}
